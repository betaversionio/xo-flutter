name: create
description: Scaffold a production-ready Flutter app

on:
  - create

inputs:
  appName:
    prompt: "App display name?"
    description: Display name shown in the OS (e.g. My App)
    required: true
    type: text

  projectName:
    prompt: "Project name (snake_case)?"
    description: Used for package imports and dart package name (e.g. my_app)
    required: true
    type: text

  orgId:
    prompt: "Organization ID?"
    description: Bundle ID prefix (e.g. com.example) — final bundle ID will be orgId.projectName
    required: true
    type: text

  stateManagement:
    prompt: "State management?"
    type: select
    choices:
      - { value: riverpod, label: "Riverpod + Hooks (recommended)" }
      - { value: bloc, label: BLoC }
      - { value: none, label: None }
    default: riverpod

  navigation:
    prompt: "Navigation?"
    type: select
    choices:
      - { value: go_router, label: "GoRouter (recommended)" }
      - { value: none, label: "Flutter Navigator 2.0" }
    default: go_router

  features:
    prompt: "Which features to include?"
    type: multiselect
    choices:
      - { value: theming, label: "Dark/Light theming" }
      - { value: networking, label: "Networking (Dio + interceptors)" }
      - { value: auth, label: "Auth screens (login / register)" }
      - { value: firebase, label: "Firebase (core + messaging)" }
      - { value: storage, label: "Secure storage + SharedPrefs" }
      - { value: flavors, label: "Flavor support (dev / staging / prod)" }

jobs:
  scaffold:
    steps:
      # Bootstrap a vanilla Flutter app
      - run: "flutter create . --org {{ inputs.orgId }} --project-name {{ inputs.projectName }}"

      # Root templates — rendered in parallel
      - uses: xo/template
        parallel: true
        with:
          from: templates/pubspec.yaml
          to: pubspec.yaml
      - uses: xo/template
        parallel: true
        with:
          from: templates/main.dart
          to: lib/main.dart
      - uses: xo/template
        parallel: true
        with:
          from: templates/app.dart
          to: lib/app.dart
      - uses: xo/copy
        parallel: true
        with:
          from: templates/analysis_options.yaml
          to: analysis_options.yaml
      - uses: xo/template
        parallel: true
        with:
          from: templates/README.md
          to: README.md

      # .vscode — rendered in parallel
      - uses: xo/copy
        parallel: true
        with:
          from: templates/.vscode/extensions.json
          to: .vscode/extensions.json
      - uses: xo/copy
        parallel: true
        with:
          from: templates/.vscode/settings.json
          to: .vscode/settings.json
      - uses: xo/template
        parallel: true
        with:
          from: templates/.vscode/launch.json
          to: .vscode/launch.json
      - uses: xo/template
        parallel: true
        with:
          from: templates/.vscode/tasks.json
          to: .vscode/tasks.json

      # android build config
      - uses: xo/template
        with:
          from: templates/android/app/build.gradle.kts
          to: android/app/build.gradle.kts

      # Logger (always included)
      - uses: xo/copy
        with:
          from: lib/base/utils/logger/logger.dart
          to: lib/utils/logger/logger.dart

      # App initializer (always included — uses Handlebars)
      - uses: xo/template
        with:
          from: lib/core/initialization/app_initializer.dart
          to: lib/core/initialization/app_initializer.dart

      # Theming — glob copies entire lib/theme/**/*.dart tree
      - if: "inputs.features && inputs.features.includes('theming')"
        uses: xo/template
        with:
          from: lib/theme/**/*.dart
          to: lib/theme/

      # Routing
      - if: "'{{ inputs.navigation }}' === 'go_router'"
        uses: xo/template
        with:
          from: lib/routes/app_router.dart
          to: lib/routes/app_router.dart

      # Networking — glob copies all files in lib/networking/ to lib/services/network/
      - if: "inputs.features && inputs.features.includes('networking')"
        uses: xo/template
        with:
          from: lib/networking/*.dart
          to: lib/services/network/

      # Auth screens — glob copies login + register
      - if: "inputs.features && inputs.features.includes('auth')"
        uses: xo/copy
        with:
          from: lib/auth/screens/*.dart
          to: lib/features/auth/screens/

      # Firebase
      - if: "inputs.features && inputs.features.includes('firebase')"
        uses: xo/template
        with:
          from: lib/firebase/firebase_service.dart
          to: lib/services/firebase/firebase_service.dart

      # Secure storage
      - if: "inputs.features && inputs.features.includes('storage')"
        uses: xo/copy
        with:
          from: lib/storage/secure_storage.dart
          to: lib/services/storage/secure_storage.dart

      # Flavors
      - if: "inputs.features && inputs.features.includes('flavors')"
        uses: xo/template
        with:
          from: lib/flavors/flavor_config.dart
          to: lib/config/flavor_config.dart

      - run: flutter pub get
